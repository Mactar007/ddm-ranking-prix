name: Veille des nouveautés (Jumia SN, AliExpress, TikTok Sénégal, Shopee, Lazada)

# Chaque lundi à 09h00 UTC (= Dakar), après la veille Serper de 08h00 (Mac007 25/10) : nouveautés Jumia SN,
# meilleures ventes AliExpress et arrivages annoncés sur TikTok Sénégal, par famille de produits ; Shopee et
# Lazada via Google (Mac007 30/10, 16 crédits Serper par semaine). Une ligne par article dans l'onglet « Nouveautés & tendances », résumé sur Telegram.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  nouveautes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer Scrapling et ses navigateurs
        run: |
          pip install -r requirements.txt
          scrapling install
      - name: Relever les nouveautés
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python nouveautes.py
